<section class="contacto">
  <div class="contacto-inner">
    <span class="contacto-kicker">Hablemos</span>
    <h1 class="contacto-title">Contacto</h1>
    <p class="contacto-subtitle">
      Escríbenos por el medio que prefieras. Respondemos con gusto tus dudas sobre productos, pedidos y envíos.
    </p>

    <div class="contacto-grid">
      <a class="contacto-card" [href]="contacto.whatsapp" target="_blank" rel="noopener">
        <span class="contacto-card-icono">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 18.15h-.01a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.11.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.24-8.23a8.2 8.2 0 0 1 5.82 2.42 8.18 8.18 0 0 1 2.41 5.82c0 4.54-3.69 8.23-8.23 8.23Zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.25-.64.8-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.13-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43l-.48-.01c-.17 0-.43.06-.66.31-.23.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.11-.22-.17-.47-.29Z"></path>
          </svg>
        </span>
        <span class="contacto-card-texto">
          <span class="contacto-card-label">WhatsApp</span>
          <span class="contacto-card-valor">+57 311 496 5150</span>
        </span>
        <span class="contacto-card-flecha" aria-hidden="true">↗</span>
      </a>

      <a class="contacto-card" [href]="contacto.instagram" target="_blank" rel="noopener">
        <span class="contacto-card-icono">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </span>
        <span class="contacto-card-texto">
          <span class="contacto-card-label">Instagram</span>
          <span class="contacto-card-valor">@cafetalsobrepiedra</span>
        </span>
        <span class="contacto-card-flecha" aria-hidden="true">↗</span>
      </a>

      <a class="contacto-card" [href]="contacto.facebook" target="_blank" rel="noopener">
        <span class="contacto-card-icono">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.9h2.54V9.85c0-2.51 1.49-3.9 3.78-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.89h2.78l-.44 2.9h-2.34v7.03C18.34 21.21 22 17.06 22 12.06Z"></path>
          </svg>
        </span>
        <span class="contacto-card-texto">
          <span class="contacto-card-label">Facebook</span>
          <span class="contacto-card-valor">Cafetal sobre piedra</span>
        </span>
        <span class="contacto-card-flecha" aria-hidden="true">↗</span>
      </a>

      <a class="contacto-card" [href]="'mailto:' + contacto.email">
        <span class="contacto-card-icono">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="4" width="20" height="16" rx="2"></rect>
            <path d="m22 6-10 7L2 6"></path>
          </svg>
        </span>
        <span class="contacto-card-texto">
          <span class="contacto-card-label">Correo</span>
          <span class="contacto-card-valor">{{ contacto.email }}</span>
        </span>
        <span class="contacto-card-flecha" aria-hidden="true">↗</span>
      </a>
    </div>

    <p class="contacto-ubicacion">
      San Vicente de Chucurí, Santander · Colombia
    </p>
  </div>
</section>
